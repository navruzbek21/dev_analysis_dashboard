services:
  app:
    build: .
    ports:
      - "8048:8048"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8048
      APP_DEBUG: "false"
      REDIS_URL: redis://redis:6379/0
      PARQUET_MONTHLY_PATH: df2.parquet
      PARQUET_YEARLY_PATH: df_ploshad_year.parquet
      AREA_CONTOURS_DIR: area_contours
      LITELLM_BASE_URL: https://litellm.tatneft.guru
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_CA_BUNDLE: ${LITELLM_CA_BUNDLE-}
      LITELLM_AUTH_HEADER_NAME: ${LITELLM_AUTH_HEADER_NAME:-Authorization}
      LITELLM_AUTH_HEADER_PREFIX: ${LITELLM_AUTH_HEADER_PREFIX-}
      LITELLM_DEFAULT_MODEL: ${LITELLM_DEFAULT_MODEL:-default}
      LITELLM_ALLOWED_MODELS: ${LITELLM_ALLOWED_MODELS:-default}
    depends_on:
      - redis
    # Для локальной разработки с горячей заменой кода создайте
    # docker-compose.override.yml (см. docker-compose.override.yml.example):
    # прод-образ должен исполнять код, собранный в образ, а не bind-mount.

  redis:
    image: redis:7
    # Порт наружу не публикуем: приложению внутри compose-сети он доступен
    # по имени сервиса, а незапароленный Redis на хосте — лишняя поверхность атаки.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
