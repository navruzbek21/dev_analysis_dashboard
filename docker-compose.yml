services:
  app:
    build: .
    ports:
      - "8048:8048"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8048
      APP_DEBUG: "false"
      REDIS_URL: redis://redis:6379/0
      PARQUET_MONTHLY_PATH: df2.parquet
      PARQUET_YEARLY_PATH: df_ploshad_year.parquet
      AREA_CONTOURS_DIR: area_contours
      LITELLM_BASE_URL: http://litellm.tatneft.guru
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_AUTH_HEADER_NAME: ${LITELLM_AUTH_HEADER_NAME:-Authorization}
      LITELLM_AUTH_HEADER_PREFIX: ${LITELLM_AUTH_HEADER_PREFIX:-Bearer}
      LITELLM_DEFAULT_MODEL: ${LITELLM_DEFAULT_MODEL:-default}
      LITELLM_ALLOWED_MODELS: ${LITELLM_ALLOWED_MODELS:-default}
    depends_on:
      - redis
    volumes:
      - .:/app

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
